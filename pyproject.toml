[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inflammatory-onco-physics"
version = "1.1.0"
authors = [
  { name="Luca Celebrano", email="l.celebrano@studenti.unina.it" },
]
description = "A Reaction-Diffusion Theory of Microvascular Pharmacological Sanctuaries and Inflammatory Pre-conditioning"
readme = "README.md"
license = "CC-BY-4.0"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "numpy>=1.23.0",
    "scipy>=1.9.0",
    "pandas>=1.5.0",
    "lifelines>=0.28.0",
    "matplotlib>=3.6.0",
    "seaborn>=0.12.0",
    "scikit-learn>=1.2.0",
]

[project.urls]
"Homepage" = "https://github.com/Lukecele/inflammatory-onco-physics"
"Bug Tracker" = "https://github.com/Lukecele/inflammatory-onco-physics/issues"
"Zenodo DOI" = "https://doi.org/10.5281/zenodo.24118328"
"Research Square" = "https://doi.org/10.21203/rs.3.rs-11695210/v1"

[project.scripts]
oncophysics-calc = "app_bedside_calculator:main"

[tool.setuptools]
py-modules = ["app_bedside_calculator"]

[tool.setuptools.packages.find]
include = ["pipeline*", "simulation*"]
exclude = ["data*", "results*", "figures*"]
